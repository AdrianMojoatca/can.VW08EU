<text x="24" y="64" font-size="12.5" fill="#666">Sus: conectoarele din masina. Jos: modulul. Fiecare fir pleaca din pinul lui; cifra de pe bara = numarul de pini al conectorului.</text>
<text x="24" y="84" font-size="12.5" fill="#8a6d00">Firele cu cerc gol nu sint conectate: nu se stie inca la ce pin din masina merg.</text>
